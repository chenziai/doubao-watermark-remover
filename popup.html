<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>豆包水印移除工具</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 豆包水印移除工具</h1>
            <p class="subtitle">去除豆包生成的图片/视频水印</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="image">📷 图片处理</button>
            <button class="tab-btn" data-tab="video">🎥 视频处理</button>
        </div>

        <!-- 图片处理标签页 -->
        <div id="image" class="tab-content active">
            <div class="upload-area" id="imageUploadArea">
                <input type="file" id="imageInput" accept="image/*" multiple style="display:none;">
                <div class="upload-icon">📷</div>
                <h3>点击或拖拽上传图片</h3>
                <p>支持 JPG, PNG, WebP 等格式</p>
            </div>
            
            <div id="imagePreview" class="preview-container" style="display:none;">
                <img id="previewImage" src="" alt="预览">
                <div class="preview-controls">
                    <label>水印移除强度:</label>
                    <input type="range" id="watermarkStrength" min="0" max="100" value="50">
                    <span id="strengthValue">50%</span>
                </div>
                <button id="removeWatermarkBtn" class="action-btn primary">🧹 移除水印</button>
                <button id="downloadImageBtn" class="action-btn">⬇️ 下载图片</button>
                <button id="resetImageBtn" class="action-btn secondary">↩️ 重置</button>
            </div>
        </div>

        <!-- 视频处理标签页 -->
        <div id="video" class="tab-content">
            <div class="upload-area" id="videoUploadArea">
                <input type="file" id="videoInput" accept="video/*" style="display:none;">
                <div class="upload-icon">🎥</div>
                <h3>点击或拖拽上传视频</h3>
                <p>支持 MP4, WebM, MOV 等格式</p>
            </div>

            <div id="videoPreview" class="preview-container" style="display:none;">
                <video id="previewVideo" controls style="width: 100%; max-height: 300px;"></video>
                
                <div class="video-controls">
                    <div class="control-group">
                        <label>视频时长限制:</label>
                        <input type="number" id="videoDuration" min="5" max="60" value="15" step="1">
                        <span>秒</span>
                    </div>

                    <div class="control-group">
                        <label>水印移除强度:</label>
                        <input type="range" id="videoWatermarkStrength" min="0" max="100" value="50">
                        <span id="videoStrengthValue">50%</span>
                    </div>

                    <div class="control-group">
                        <label>输出质量:</label>
                        <select id="videoQuality">
                            <option value="low">低 (480p)</option>
                            <option value="medium" selected>中 (720p)</option>
                            <option value="high">高 (1080p)</option>
                        </select>
                    </div>
                </div>

                <button id="processVideoBtn" class="action-btn primary">⚙️ 处理视频</button>
                <button id="downloadVideoBtn" class="action-btn">⬇️ 下载视频</button>
                <button id="resetVideoBtn" class="action-btn secondary">↩️ 重置</button>

                <div id="processProgress" class="progress-container" style="display:none;">
                    <div class="progress-bar">
                        <div id="progressFill" class="progress-fill"></div>
                    </div>
                    <p id="progressText">处理中: 0%</p>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>💡 提示: 仅处理您自己生成的内容</p>
        </div>
    </div>

    <script src="libs/opencv.js"></script>
    <script src="libs/ffmpeg.min.js"></script>
    <script src="popup.js"></script>
</body>
</html>
